<!DOCTYPE html>
<html>

<head>
    <title>Extension Admin Panel</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: auto;
            padding: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        #tokenBox {
            margin-top: 15px;
            padding: 10px;
            background: #eee;
        }
    </style>
</head>

<body>
    <h2>Admin Panel — Generate Token</h2>

    <input type="password" id="adminPass" placeholder="Admin Password" />

    <button id="btnGen">Generate Token</button>

    <div id="tokenBox" hidden>
        <h4>Generated Token:</h4>
        <textarea id="tokenOutput" rows="4" style="width:100%"></textarea>
        <button id="btnCopy">Copy Token</button>
    </div>

    <script src="admin.js"></script>
</body>

</html>
